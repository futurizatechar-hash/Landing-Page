<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgIso" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#18233C"/>
      <stop offset="60%" stop-color="#0B111F"/>
      <stop offset="100%" stop-color="#03060A"/>
    </radialGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="100%" stop-color="#C40000"/>
    </linearGradient>

    <radialGradient id="glowRed" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#E60000" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowIso" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 1. Fondo Oscuro -->
  <rect width="1080" height="1080" fill="url(#bgIso)"/>
  
  <!-- 2. Luz de Resplandor Central -->
  <circle cx="540" cy="540" r="460" fill="url(#glowRed)"/>

  <!-- 3. Anillo de Contorno Circular Exterior -->
  <circle cx="540" cy="540" r="505" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="540" cy="540" r="485" fill="none" stroke="#E60000" stroke-opacity="0.45" stroke-width="4"/>

  <!-- 4. EMBLEMA MONOGRAMA TT EN ESCENA CENTRAL -->
  <g transform="translate(540, 520)" filter="url(#shadowIso)">
    <!-- Silueta estilizada de la Tablita vertical -->
    <rect x="-240" y="-280" width="480" height="500" rx="46" fill="#0E1626" stroke="#FFFFFF" stroke-width="8"/>
    
    <!-- Mango superior de la tablita -->
    <path d="M -70 -280 L -70 -370 Q -70 -410 0 -410 Q 70 -410 70 -370 L 70 -280 Z" fill="#0E1626" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Orificio del mango con acento ámbar -->
    <circle cx="0" cy="-350" r="24" fill="#03060A" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="0" cy="-350" r="10" fill="#F59E0B"/>

    <!-- Monograma Central TT Caligráfico / Corpóreo -->
    <text x="0" y="30" font-family="'Kaushan Script', 'Brush Script MT', cursive, sans-serif" 
          font-size="240" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="-8">TT</text>
    
    <!-- Línea divisoria roja -->
    <rect x="-160" y="70" width="320" height="6" rx="3" fill="url(#redGrad)"/>

    <!-- Texto AUTOSERVICIO -->
    <text x="0" y="130" font-family="'Montserrat', sans-serif" 
          font-size="34" font-weight="900" font-style="italic" fill="url(#redGrad)" text-anchor="middle" letter-spacing="8">
      AUTOSERVICIO
    </text>

    <!-- Subtítulo Malagueño -->
    <text x="0" y="175" font-family="'Montserrat', sans-serif" 
          font-size="20" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="4">
      MALAGUEÑO
    </text>
  </g>
</svg>
