<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgIso" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="60%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#03060B"/>
    </radialGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E60000"/>
      <stop offset="100%" stop-color="#FF2200"/>
    </linearGradient>

    <filter id="shadowIso" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 1. Fondo Oscuro Sólido (Sin líneas ni marcas ajenas) -->
  <rect width="1080" height="1080" fill="url(#bgIso)"/>
  
  <!-- 2. EMBLEMA MONOGRAMA TT 100% CENTRADO -->
  <g transform="translate(540, 540)" filter="url(#shadowIso)">
    <!-- Silueta de la Tablita vertical -->
    <rect x="-240" y="-270" width="480" height="510" rx="46" fill="#0C1322" stroke="#FFFFFF" stroke-width="8"/>
    
    <!-- Mango superior de la tablita -->
    <path d="M -70 -270 L -70 -360 Q -70 -400 0 -400 Q 70 -400 70 -360 L 70 -270 Z" fill="#0C1322" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Orificio del mango con detalle ámbar -->
    <circle cx="0" cy="-340" r="24" fill="#03060B" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="0" cy="-340" r="10" fill="#F59E0B"/>

    <!-- Monograma TT Caligráfico -->
    <text x="0" y="45" font-family="'Kaushan Script', 'Brush Script MT', cursive, sans-serif" 
          font-size="240" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="-8">TT</text>
    
    <!-- Línea divisoria roja -->
    <rect x="-160" y="90" width="320" height="6" rx="3" fill="url(#redGrad)"/>

    <!-- Subtítulo AUTOSERVICIO -->
    <text x="0" y="155" font-family="'Montserrat', sans-serif" 
          font-size="34" font-weight="900" font-style="italic" fill="url(#redGrad)" text-anchor="middle" letter-spacing="8">
      AUTOSERVICIO
    </text>
  </g>
</svg>
