<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Fondo Gradiente Limpio y Oscuro -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#111A2C"/>
      <stop offset="60%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#04060B"/>
    </radialGradient>
    
    <!-- Gradiente Rojo Tablita Original -->
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E60000"/>
      <stop offset="100%" stop-color="#FF2200"/>
    </linearGradient>

    <!-- Sombra de realce suave -->
    <filter id="shadowClean" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 1. Fondo Oscuro Sólido y Profesional (Sin guías ni líneas punteadas) -->
  <rect width="1080" height="1080" fill="url(#bgGlow)"/>

  <!-- 2. LOGO OFICIAL 100% CENTRADO VERTICAL Y HORIZONTALMENTE -->
  <!-- Logo original: 360x88. Escalado a 2.3x (828px ancho x 202px alto), centrado en (540, 540) -->
  <g transform="translate(540, 540) scale(2.3) translate(-176, -44)" filter="url(#shadowClean)">
    
    <!-- Trazo de la Tablita con mango -->
    <path d="M 18 46 L 21 69 Q 23 78 38 78 L 274 71 Q 290 70 292 56 L 294 42 Q 295 34 307 34 L 327 34 Q 345 34 345 21 Q 345 9 327 11 L 296 15" 
          stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Orificio del mango de la tablita con detalle ámbar -->
    <circle cx="328" cy="22" r="5" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
    <circle cx="328" cy="22" r="1.8" fill="#F59E0B"/>

    <!-- Caligrafía principal "Tu Tablita" -->
    <text x="28" y="45" font-family="'Kaushan Script', 'Brush Script MT', cursive, sans-serif" 
          font-size="45" font-weight="400" fill="#FFFFFF" letter-spacing="0.5">Tu Tablita</text>

    <!-- Subtítulo corpóreo "AUTOSERVICIO" en Rojo Cartel -->
    <text x="68" y="67" font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-size="14.5" font-weight="900" font-style="italic" fill="url(#redAccent)" letter-spacing="3.2">AUTOSERVICIO</text>
  </g>
</svg>
