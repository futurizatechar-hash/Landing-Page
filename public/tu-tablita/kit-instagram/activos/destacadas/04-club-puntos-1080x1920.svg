<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="60%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#03060B"/>
    </radialGradient>
    <filter id="glowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bgC)"/>

  <!-- Centro Exacto: (540, 960) -->
  <g transform="translate(540, 960)" filter="url(#glowC)">
    <circle cx="0" cy="0" r="280" fill="#0C1424" stroke="#E60000" stroke-width="6"/>
    <circle cx="0" cy="0" r="255" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    
    <!-- Ícono: Caja de Regalo / Club de Premios -->
    <g transform="translate(0, 10)">
      <!-- Caja inferior -->
      <rect x="-90" y="-30" width="180" height="120" rx="12" fill="#111B2C" stroke="#FFFFFF" stroke-width="10"/>
      <!-- Tapa de la caja -->
      <rect x="-105" y="-60" width="210" height="34" rx="8" fill="#111B2C" stroke="#FFFFFF" stroke-width="10"/>
      <!-- Cintas de regalo -->
      <line x1="0" y1="-60" x2="0" y2="90" stroke="#E60000" stroke-width="14"/>
      
      <!-- Moño superior estilizado -->
      <path d="M 0 -60 Q -45 -110 -65 -80 Q -75 -50 0 -60" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
      <path d="M 0 -60 Q 45 -110 65 -80 Q 75 -50 0 -60" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="-60" r="10" fill="#F59E0B"/>
    </g>
  </g>
</svg>
