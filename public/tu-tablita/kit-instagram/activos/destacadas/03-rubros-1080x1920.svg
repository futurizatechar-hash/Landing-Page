<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="60%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#03060B"/>
    </radialGradient>
    <filter id="glowR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bgR)"/>

  <!-- Centro Exacto: (540, 960) -->
  <g transform="translate(540, 960)" filter="url(#glowR)">
    <circle cx="0" cy="0" r="280" fill="#0C1424" stroke="#E60000" stroke-width="6"/>
    <circle cx="0" cy="0" r="255" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    
    <!-- Ícono: Changuito de Compras Autoservicio -->
    <g transform="translate(0, 5)">
      <!-- Ruedas -->
      <circle cx="-50" cy="85" r="16" fill="#F59E0B"/>
      <circle cx="55" cy="85" r="16" fill="#F59E0B"/>
      
      <!-- Chasis del carrito -->
      <path d="M -115 -75 L -85 -75 L -35 45 L 85 45" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Canasta -->
      <path d="M -70 -40 L 95 -40 L 75 25 L -45 25 Z" fill="#111B2C" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
      
      <!-- Rejilla de la canasta -->
      <line x1="-15" y1="-40" x2="-5" y2="25" stroke="#E60000" stroke-width="6"/>
      <line x1="25" y1="-40" x2="35" y2="25" stroke="#E60000" stroke-width="6"/>
      <line x1="-60" y1="-10" x2="85" y2="-10" stroke="#E60000" stroke-width="6"/>
    </g>
  </g>
</svg>
