<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgU" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="60%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#03060B"/>
    </radialGradient>
    <filter id="glowU" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bgU)"/>

  <!-- Centro Exacto: (540, 960) -->
  <g transform="translate(540, 960)" filter="url(#glowU)">
    <circle cx="0" cy="0" r="280" fill="#0C1424" stroke="#E60000" stroke-width="6"/>
    <circle cx="0" cy="0" r="255" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    
    <!-- Ícono: Pin de Localización / Dónde Estamos -->
    <g transform="translate(0, -10)">
      <!-- Sombra / base del pin -->
      <ellipse cx="0" cy="115" rx="55" ry="14" fill="#000000" fill-opacity="0.5"/>
      <ellipse cx="0" cy="115" rx="35" ry="8" fill="#E60000" fill-opacity="0.4"/>
      
      <!-- Cuerpo del pin -->
      <path d="M 0 95 C -65 30 -85 -10 -85 -55 C -85 -105 -45 -145 0 -145 C 45 -145 85 -105 85 -55 C 85 -10 65 30 0 95 Z" 
            fill="#111B2C" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round"/>
      
      <!-- Punto central del pin -->
      <circle cx="0" cy="-55" r="32" fill="#E60000"/>
      <circle cx="0" cy="-55" r="14" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
