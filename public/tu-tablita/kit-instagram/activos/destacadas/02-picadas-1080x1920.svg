<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="60%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#03060B"/>
    </radialGradient>
    <filter id="glowP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bgP)"/>

  <!-- Centro Exacto: (540, 960) -->
  <g transform="translate(540, 960)" filter="url(#glowP)">
    <circle cx="0" cy="0" r="280" fill="#0C1424" stroke="#E60000" stroke-width="6"/>
    <circle cx="0" cy="0" r="255" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    
    <!-- Ícono: Tabla de Fiambres / Queso / Picada -->
    <g transform="translate(0, -10)">
      <!-- Base de la tabla de madera -->
      <path d="M -110 -50 L 80 -50 Q 100 -50 110 -30 L 110 90 Q 110 110 90 110 L -90 110 Q -110 110 -110 90 Z" 
            fill="#111B2C" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
      <!-- Mango de la tabla -->
      <path d="M -110 -10 L -155 -10 Q -175 -10 -175 -35 Q -175 -60 -155 -60 L -110 -60" 
            fill="#111B2C" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-150" cy="-35" r="9" fill="#F59E0B"/>

      <!-- Rodajas de salame / fiambre en la tabla -->
      <circle cx="-35" cy="45" r="30" fill="none" stroke="#E60000" stroke-width="8"/>
      <circle cx="20" cy="55" r="30" fill="none" stroke="#E60000" stroke-width="8"/>
      
      <!-- Trozo de queso artesanal -->
      <path d="M 0 -25 L 65 -25 L 75 10 L -5 10 Z" fill="#F59E0B" fill-opacity="0.9"/>
      <circle cx="25" cy="-8" r="4" fill="#0C1424"/>
      <circle cx="50" cy="-5" r="5" fill="#0C1424"/>
      <circle cx="15" cy="2" r="3" fill="#0C1424"/>
    </g>
  </g>
</svg>
