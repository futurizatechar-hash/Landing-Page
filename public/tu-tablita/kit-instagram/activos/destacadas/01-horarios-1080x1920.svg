<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgH" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="60%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#03060B"/>
    </radialGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fondo Completo Historia Vertical -->
  <rect width="1080" height="1920" fill="url(#bgH)"/>

  <!-- Centro Exacto de Recorte de Instagram: (540, 960) -->
  <g transform="translate(540, 960)" filter="url(#glowH)">
    <!-- Círculo Guía Exterior -->
    <circle cx="0" cy="0" r="280" fill="#0C1424" stroke="#E60000" stroke-width="6"/>
    <circle cx="0" cy="0" r="255" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    
    <!-- Ícono: Reloj de Horario Corrido (08 a 23 hs) -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <!-- Manecillas marcando horario -->
    <line x1="0" y1="0" x2="0" y2="-75" stroke="#E60000" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="55" y2="35" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#F59E0B"/>

    <!-- Puntos cardinales del reloj -->
    <circle cx="0" cy="-115" r="5" fill="#CBD5E1"/>
    <circle cx="115" cy="0" r="5" fill="#CBD5E1"/>
    <circle cx="0" cy="115" r="5" fill="#CBD5E1"/>
    <circle cx="-115" cy="0" r="5" fill="#CBD5E1"/>
  </g>
</svg>
