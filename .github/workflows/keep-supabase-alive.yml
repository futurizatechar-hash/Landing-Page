name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta cada 2 días a las 11:00 UTC (08:00 AM Argentina)
    - cron: '0 11 */2 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Consulta Activa a Supabase PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Consultar tabla leads_futuriza vía PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "⚠️ Secretos SUPABASE_URL o SUPABASE_ANON_KEY no configurados en GitHub Repository Secrets."
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/leads_futuriza?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")

          echo "Código HTTP recibido de Supabase: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Instancia de Supabase activa y respondiendo."
          else
            echo "❌ Error en consulta a Supabase. Código HTTP: ${HTTP_STATUS}"
            cat response.json || true
            exit 1
          fi
